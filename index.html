<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chúc Mừng Quốc Tế Thiếu Nhi 1/6</title>

<style>
body {
    margin: 0;
    /* Nền màu xanh đen chủ đạo */
    background: linear-gradient(135deg, #0f172a, #1e1b4b, #311042);
    overflow-x: hidden;
    font-family: Arial, sans-serif;
    text-align: center;
    color: #f1f5f9;
}

.container {
    margin-top: 50px;
    padding: 20px;
}

h1 {
    color: #f472b6; 
    font-size: 35px;
    text-shadow: 0 0 15px rgba(244, 114, 182, 0.6);
}

p {
    font-size: 18px;
    color: #cbd5e1;
    max-width: 600px;
    margin: auto;
    line-height: 1.6;
}

/* Khung nhập câu trả lời */
.reply-form {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(10px);
    padding: 25px;
    border-radius: 20px;
    max-width: 400px;
    margin: 30px auto;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}

.reply-form h3 {
    margin-top: 0;
    color: #38bdf8;
}

textarea {
    width: 100%;
    height: 80px;
    background: rgba(0, 0, 0, 0.3);
    border: 1px solid #f472b6;
    border-radius: 10px;
    color: #fff;
    padding: 10px;
    box-sizing: border-box;
    resize: none;
    font-size: 16px;
}

textarea:focus {
    outline: none;
    box-shadow: 0 0 10px #f472b6;
}

button {
    background: linear-gradient(90deg, #f472b6, #38bdf8);
    color: white;
    border: none;
    padding: 12px 30px;
    font-size: 16px;
    font-weight: bold;
    border-radius: 25px;
    cursor: pointer;
    margin-top: 15px;
    transition: 0.3s;
    box-shadow: 0 5px 15px rgba(244, 114, 182, 0.4);
}

button:hover {
    transform: scale(1.05);
    box-shadow: 0 5px 20px #38bdf8;
}

/* Hiệu ứng sao lấp lánh bay lên */
.star {
    position: absolute;
    animation: float 8s linear infinite;
    pointer-events: none;
}

@keyframes float {
    from {
        transform: translateY(100vh) rotate(0deg);
        opacity: 1;
    }
    to {
        transform: translateY(-100px) rotate(360deg);
        opacity: 0;
    }
}
</style>
</head>

<body>

<div class="container">
    <h1>🎈 Chúc Mừng Quốc Tế Thiếu Nhi 1/6 🎈</h1>

    <p>
        Chúc cậu luôn vui vẻ, mạnh khỏe, có thật nhiều tiếng cười và những kỷ niệm đẹp. 
        Mong mọi điều may mắn sẽ đến với cậu hôm nay và mỗi ngày sau đó. ✨
    </p>

    <br>

    <img src="https://images.unsplash.com/photo-1516627145497-ae6968895b74?w=800"
         width="260"
         style="border-radius:20px; box-shadow: 0 0 25px rgba(244, 114, 182, 0.3);">

    <!-- FORM ĐÃ ĐƯỢC TÍCH HỢP ĐƯỜNG LINK FORMSPREE CỦA CẬU -->
    <div class="reply-form">
        <h3>Gửi lời nhắn cho tớ nhé 💬</h3>
        <form action="https://formspree.io/f/mlgvqlwy" method="POST">
            <textarea name="message" placeholder="Nhập câu trả lời hoặc lời chúc của cậu vào đây..." required></textarea>
            <button type="submit">Gửi đi liền ✨</button>
        </form>
    </div>

    <audio controls autoplay loop style="margin-top: 10px;">
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3">
    </audio>
</div>

<script>
// Tạo hiệu ứng ngôi sao lấp lánh bay lên nền đêm xanh đen
const colors = ["✨", "⭐", "💖", "💙"];
for(let i=0; i<40; i++){
    let star = document.createElement("div");
    star.innerHTML = colors[Math.floor(Math.random() * colors.length)];
    star.className = "star";
    star.style.left = Math.random() * 100 + "vw";
    star.style.fontSize = (15 + Math.random() * 20) + "px";
    star.style.animationDuration = (6 + Math.random() * 6) + "s";
    star.style.animationDelay = (Math.random() * 5) + "s";
    document.body.appendChild(star);
}
</script>

</body>
</html>
