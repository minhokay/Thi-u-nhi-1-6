<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chúc Mừng Quốc Tế Thiếu Nhi 1/6</title>

<style>
body{
    margin:0;
    background:linear-gradient(135deg,#ffd6e7,#dff7ff);
    overflow:hidden;
    font-family:Arial,sans-serif;
    text-align:center;
}

.container{
    margin-top:80px;
    padding:20px;
}

h1{
    color:#ff4f8b;
    font-size:40px;
}

p{
    font-size:22px;
    color:#444;
    max-width:700px;
    margin:auto;
}

.heart{
    position:absolute;
    color:red;
    animation:float 8s linear infinite;
}

@keyframes float{
    from{
        transform:translateY(100vh);
        opacity:1;
    }
    to{
        transform:translateY(-100px);
        opacity:0;
    }
}
</style>
</head>

<body>

<div class="container">
    <h1>🎈 Chúc Mừng Quốc Tế Thiếu Nhi 1/6 🎈</h1>

    <p>
        Chúc vk iu hc hàng giỏi giang sau này còn mang theo của nợ là ck❤️❤️✨
    </p>

    <br><br>

    <img src="https://images.unsplash.com/photo-1516627145497-ae6968895b74?w=800"
         width="300"
         style="border-radius:20px;box-shadow:0 0 20px rgba(0,0,0,.2);">

    <br><br>

    <audio controls autoplay loop>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3">
    </audio>
</div>

<script>
for(let i=0;i<30;i++){
    let heart=document.createElement("div");
    heart.innerHTML="❤️";
    heart.className="heart";
    heart.style.left=Math.random()*100+"vw";
    heart.style.fontSize=(20+Math.random()*30)+"px";
    heart.style.animationDuration=(5+Math.random()*5)+"s";
    document.body.appendChild(heart);
}
</script>

</body>
</html>
